<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Amber Terminal: an amber prompt (>_) on a black terminal screen with an amber frame and faint scan lines. -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbf66"/>
      <stop offset="1" stop-color="#ff8c00"/>
    </linearGradient>
    <radialGradient id="g" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#2a1a05"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffa028" opacity="0.07"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#g)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#s)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="10.5" fill="none" stroke="url(#a)" stroke-width="3"/>
  <path d="M15 20 L29 32 L15 44" fill="none" stroke="url(#a)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="33" y="40" width="17" height="6.5" rx="2" fill="url(#a)"/>
</svg>
